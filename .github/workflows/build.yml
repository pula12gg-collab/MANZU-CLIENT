
name: Build MANZU CLIENT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract client ZIP
        run: |
          unzip -o MANZU-CLIENT-source.zip -d project
          cd project
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: project
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MANZU-CLIENT
          path: project/build/libs/*.jar
